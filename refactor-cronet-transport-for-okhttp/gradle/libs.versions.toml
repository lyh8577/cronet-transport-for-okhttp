[versions]
agp = "9.3.0"

androidx-annotation = "1.10.0"

cronet = "500.0.2"
cronet-okhttp = "0.1.1"
play-services-cronet = "18.1.1"
guava = "33.7.1-android"
jsr305 = "3.0.2"

okhttp = "5.5.0"
okio = "3.18.1"

# https://github.com/vanniktech/gradle-maven-publish-plugin
mavenPublish = "0.37.0"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }

cronet = { module = "org.chromium.net:cronet", version.ref = "cronet" }
cronet-bundled = { module = "org.chromium.net:cronet-bundled", version.ref = "cronet" }

cronet-okhttp = { module = "com.google.net.cronet:cronet-okhttp", version.ref = "cronet-okhttp" }
play-services-cronet = { module = "com.google.android.gms:play-services-cronet", version.ref = "play-services-cronet" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
gradleMavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
